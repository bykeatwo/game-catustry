<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cat's Food Chain Farm</title>
</head>
<body>
  <div id="game"></div>
  <div id="shop" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:50;">
    <div style="margin:10% auto; width:min(90%,420px); background:#fff; color:#222; border-radius:12px; padding:16px;">
      <h2 style="margin:0 0 8px;">🏪 Merchant</h2>
      <div id="shop-status" style="color:#c0392b; min-height:1.2em; font-weight:bold;"></div>
      <div id="shop-seeds"></div>
      <h3>Your goods</h3>
      <div id="shop-sell"></div>
      <button id="shop-close">Close</button>
    </div>
  </div>
  <div id="plant" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:50;">
    <div style="margin:10% auto; width:min(90%,420px); background:#fff; color:#222; border-radius:12px; padding:16px;">
      <h2 style="margin:0 0 8px;">🌱 Plant a crop</h2>
      <div id="plant-status" style="color:#c0392b; min-height:1.2em; font-weight:bold;"></div>
      <div id="plant-options"></div>
      <button id="plant-close">Close</button>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
